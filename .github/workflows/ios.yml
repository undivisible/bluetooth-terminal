name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin); \
          print(next(dev['udid'] for runtime,devs in d['devices'].items() if 'iOS' in runtime and 'SimRuntime' in runtime \
            for dev in devs if dev.get('isAvailable') and 'iPhone' in dev.get('name','')))")
          xcodebuild test \
            -project BluetoothTerminal.xcodeproj \
            -scheme BluetoothTerminal \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath .brisk/DerivedData \
            CODE_SIGNING_ALLOWED=NO
