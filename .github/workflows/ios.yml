name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen and LuaJIT
        run: brew install xcodegen luajit

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | luajit .github/scripts/select-ios-device.lua)
          xcodebuild test \
            -project BluetoothTerminal.xcodeproj \
            -scheme BluetoothTerminal \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath .brisk/DerivedData \
            CODE_SIGNING_ALLOWED=NO
