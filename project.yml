name: BluetoothTerminal
options:
  bundleIdPrefix: company.atechnology
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  DEVELOPMENT_TEAM: LZ3NL5434Q
  SWIFT_VERSION: "5.0"
configs:
  Debug: debug
  Release: release
targets:
  BluetoothTerminal:
    type: application
    platform: iOS
    sources:
      - path: bluetooth terminal
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: company.atechnology.bluetooth-terminal
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: YES
      ENABLE_PREVIEWS: YES
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_EMIT_LOC_STRINGS: YES
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "This app needs Bluetooth to connect to and communicate with BLE devices like JDY-23 modules."
      INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "This app needs Bluetooth to connect to BLE peripheral devices."
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  BluetoothTerminalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BluetoothTerminalTests
    dependencies:
      - target: BluetoothTerminal
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: company.atechnology.bluetooth-terminal.tests
schemes:
  BluetoothTerminal:
    build:
      targets:
        BluetoothTerminal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BluetoothTerminalTests
